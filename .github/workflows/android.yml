# Builds the Android app in GitHub's cloud, so nothing has to be installed on the PC (no Android Studio).
# It runs only when asked: from the "Actions" tab (Run workflow) or by pushing a tag named movil-v*, which also publishes a release.
name: Android

on:
  workflow_dispatch:
  push:
    tags: ["movil-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a Python on the build machine with the same major.minor as the app's (3.13).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests of the Python that goes into the app
        run: |
          python -m pip install --upgrade pip pytest yt-dlp
          python -m pytest tests/test_android_spike.py -q

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Burdamix-${GITHUB_REF_NAME//\//-}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: burdamix-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/movil-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: burdamix-apk
          path: dist
      - name: Publish the release (marked as a pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "Burdamix móvil $GITHUB_REF_NAME" \
            --notes "Versión de prueba para Android. Instala el APK permitiendo «instalar apps desconocidas». Cada versión nueva se instala encima de la anterior."
